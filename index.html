<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Keystone AI - Home Design in Plain Language</title>
    <meta name="description" content="Describe your home in a sentence and get a real floor plan, four elevations and an exterior render. Free, no account needed.">
    <meta name="theme-color" content="#AD3300">
    <!-- %VITE_SITE_ORIGIN% is substituted by Vite at build time. Set it in
         the Vercel project env so scrapers that do not run JS resolve these
         absolute URLs. The SPA also rewrites all of this per route at
         runtime (see useRouteMeta), which covers crawlers that do. -->
    <link rel="canonical" href="%VITE_SITE_ORIGIN%/">
    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Keystone AI">
    <meta property="og:url" content="%VITE_SITE_ORIGIN%/">
    <meta property="og:title" content="Keystone AI - Home Design in Plain Language">
    <meta property="og:description" content="Describe your home in a sentence and get a real floor plan, four elevations and an exterior render. Free, no account needed.">
    <meta property="og:image" content="%VITE_SITE_ORIGIN%/images/og-preview.png">
    <meta property="og:image:width" content="1440">
    <meta property="og:image:height" content="756">
    <meta property="og:image:alt" content="The Keystone studio showing a generated two-level floor plan.">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Keystone AI - Home Design in Plain Language">
    <meta name="twitter:description" content="Describe your home in a sentence and get a real floor plan, four elevations and an exterior render. Free, no account needed.">
    <meta name="twitter:image" content="%VITE_SITE_ORIGIN%/images/og-preview.png">
    <link rel="apple-touch-icon" href="/images/keystone-logo-mark.svg">
    <link rel="icon" href="images/keystone-logo-mark.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<!-- #generator is not an element. On the homepage the hash happened to
     open the studio modal; on the seven subpages the link did nothing at
     all. A skip link's job is to bypass the nav and land on content. -->
<a href="#main" class="skip-link">Skip to content</a>
<div class="page-veil" id="page-veil" aria-hidden="true"></div>
<div class="scroll-progress-bar" id="scroll-progress" aria-hidden="true"></div>
<div id="root"></div>
<script>
    // Disable browser scroll restoration so refresh always starts at top
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

    // Scroll progress bar
    (function() {
        var bar = document.getElementById('scroll-progress');
        if (!bar) return;
        var ticking = false;
        function updateBar() {
            var scrollTop = window.scrollY || document.documentElement.scrollTop;
            var docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            var pct = docHeight > 0 ? Math.min(100, (scrollTop / docHeight) * 100) : 0;
            bar.style.width = pct + '%';
            ticking = false;
        }
        window.addEventListener('scroll', function() {
            if (!ticking) { requestAnimationFrame(updateBar); ticking = true; }
        }, { passive: true });
    })();
</script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
