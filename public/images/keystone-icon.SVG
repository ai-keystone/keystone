<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 90" width="100%" height="100%">
  <defs>
    <!-- Soft breathing glow for the orange AI wedge -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF6A37" flood-opacity="0.3">
        <!-- Breathes the blur radius continuously -->
        <animate attributeName="stdDeviation" values="3; 6; 3" dur="2.5s" repeatCount="indefinite" begin="1s"/>
      </feDropShadow>
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(15, 15)">
    
    <!-- Vertical structural line of the K -->
    <!-- Grows from the bottom up -->
    <rect x="10" y="50" width="8" height="0" rx="2" fill="#090909">
      <animate attributeName="height" values="0; 40" begin="0s" dur="0.6s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1"/>
      <animate attributeName="y" values="50; 10" begin="0s" dur="0.6s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1"/>
    </rect>
    
    <!-- Top arm of the K forming half a keystone -->
    <!-- Fades and slides in from the top right -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 1" begin="0.3s" dur="0.5s" fill="freeze"/>
      <polygon points="22,28 42,10 50,10 22,35" fill="#1B4F82">
        <animateTransform attributeName="transform" type="translate" values="10 -10; 0 0" begin="0.3s" dur="0.5s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1"/>
      </polygon>
    </g>
    
    <!-- Bottom arm of the K Glowing AI Accent -->
    <!-- Fades and slides in from the bottom right -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 1" begin="0.5s" dur="0.5s" fill="freeze"/>
      <polygon points="22,32 50,50 42,50 22,38" fill="#FF6A37" filter="url(#softGlow)">
        <animateTransform attributeName="transform" type="translate" values="10 10; 0 0" begin="0.5s" dur="0.5s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1"/>
      </polygon>
    </g>
    
    <!-- CAD Dimension lines connecting the shapes -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 1" begin="0.9s" dur="0.3s" fill="freeze"/>
      
      <!-- Top horizontal tick stretches out -->
      <line x1="52" y1="10" x2="52" y2="10" stroke="#6E6A66" stroke-width="1">
        <animate attributeName="x2" values="52; 58" begin="0.9s" dur="0.3s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1"/>
      </line>
      
      <!-- Bottom horizontal tick stretches out -->
      <line x1="52" y1="50" x2="52" y2="50" stroke="#6E6A66" stroke-width="1">
        <animate attributeName="x2" values="52; 58" begin="0.9s" dur="0.3s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1"/>
      </line>
      
      <!-- Dashed measurement line draws from top to bottom -->
      <line x1="55" y1="10" x2="55" y2="10" stroke="#6E6A66" stroke-width="1" stroke-dasharray="2,2">
        <animate attributeName="y2" values="10; 50" begin="1.1s" dur="0.4s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1"/>
      </line>
      
      <!-- CAD Arrows pop in at the end -->
      <g opacity="0">
        <animate attributeName="opacity" values="0; 1" begin="1.4s" dur="0.2s" fill="freeze"/>
        <polygon points="55,10 53,14 57,14" fill="#6E6A66"/>
        <polygon points="55,50 53,46 57,46" fill="#6E6A66"/>
      </g>
    </g>
  </g>

  <!-- LOGOTYPE GROUP -->
  <!-- Slides in smoothly from the left as it fades up -->
  <g opacity="0">
    <animate attributeName="opacity" values="0; 1" begin="0.7s" dur="0.8s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1"/>
    <animateTransform attributeName="transform" type="translate" values="-15 0; 0 0" begin="0.7s" dur="0.8s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1"/>
    
    <text x="95" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="32" letter-spacing="-0.04em" fill="#090909">Keystone</text>
    
    <!-- AI text has a slow, continuous color shift between your two blue brand variables -->
    <text x="245" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="32" fill="#1B4F82">
      <animate attributeName="fill" values="#1B4F82; #2563A8; #1B4F82" dur="4s" repeatCount="indefinite" begin="1.5s"/>
      AI
    </text>

    <!-- Monospace descriptive tag -->
    <text x="97" y="72" font-family="monospace" font-weight="600" font-size="10" letter-spacing="0.18em" fill="#6E6A66">B2B ARCHITECTURE STUDIO</text>
  </g>
</svg>